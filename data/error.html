<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%app_name% - Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white">
  <div class="w-[400px] bg-gray-800 rounded-lg shadow-lg p-6 text-center">
    <h1 class="text-xl font-bold uppercase tracking-wide mb-4">%app_name%</h1>
    <h2 class="text-2xl font-semibold mb-4 text-red-400">Authentication failed</h2>
    <p class="text-gray-300">%error%</p>
    <p class="mt-6 text-sm text-gray-500">You can close this window.</p>
  </div>
</body>
</html>
