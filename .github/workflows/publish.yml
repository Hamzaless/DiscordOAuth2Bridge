name: Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore OAuth2Bridge.sln
      - name: Build Release
        run: dotnet build OAuth2Bridge.sln -c Release --no-restore
      - name: Test
        run: dotnet test OAuth2Bridge.Tests/OAuth2Bridge.Tests.csproj -c Release --no-build
      - name: Pack
        run: dotnet pack OAuth2Bridge.csproj -c Release --no-build -o ./artifacts
      - name: Push to NuGet.org
        if: secrets.NUGET_API_KEY != ''
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate || echo "GitHub Packages push skipped"
